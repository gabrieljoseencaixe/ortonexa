<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#171A18;--mut:#5E6A63;--line:#E1E8E3;--green:#B9E4C9;--gold:#C9A44C;--side:#FFFFFF;--soft:#F3FAF6;--warn:#F3E2A3;--blue:#CFE0F3;--grey:#E3E6E4;--red:#F2C4BE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101311;--card:#1A1F1C;--ink:#EEF2EF;--mut:#9AA89F;--line:#2B332E;--side:#101311;--soft:#18201B;--warn:#5C4F1E;--blue:#26405C;--grey:#343A36;--red:#5E2B26;--green:#2F5F45}}
:root[data-theme="dark"]{--bg:#101311;--card:#1A1F1C;--ink:#EEF2EF;--mut:#9AA89F;--line:#2B332E;--side:#101311;--soft:#18201B;--warn:#5C4F1E;--blue:#26405C;--grey:#343A36;--red:#5E2B26;--green:#2F5F45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Jost,system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;letter-spacing:-.01em}
nav{width:216px;background:var(--side);color:var(--sideInk);padding:20px 12px;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column;gap:4px}
nav .brand{font:700 18px 'Bricolage Grotesque',sans-serif;padding:4px 12px 18px}
nav .brand small{display:block;font:400 12px Figtree;opacity:.6}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;border-left:3px solid transparent;opacity:.78}
nav button:hover{opacity:1;background:#ffffff14}
nav button[aria-current=page]{opacity:1;background:#ffffff1a;border-left-color:var(--gold)}
nav button:focus-visible,.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
main{flex:1;min-width:0;padding:28px clamp(16px,3vw,40px) 60px;max-width:1180px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top p{margin:2px 0 0;color:var(--mut)}
.chips{display:flex;gap:6px}
.chip{all:unset;cursor:pointer;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.chip[aria-pressed=true]{background:var(--green);color:#171A18;border-color:var(--green);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font:700 26px 'Bricolage Grotesque',sans-serif;margin-top:2px}
.kpi span{color:var(--mut);font-size:13px}
.kpi.main{border-top:3px solid var(--gold)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{color:var(--mut);display:block}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;color:#171A18;white-space:nowrap}
.s-conf{background:var(--green)}.s-aguard{background:var(--warn)}.s-atend{background:var(--blue)}.s-conc{background:var(--grey)}.s-falta{background:var(--red)}
.btn{all:unset;cursor:pointer;padding:7px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:13px}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:22px}
dialog::backdrop{background:#0008}
.tl{border-left:2px solid var(--green);margin-left:6px;padding-left:14px}
.tl div{margin-bottom:12px}.tl small{color:var(--mut);display:block}
.neg{color:#B3342B}@media (prefers-color-scheme:dark){.neg{color:#F09B93}}

h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
h1{font-size:36px;line-height:1.1}h3{font-size:22px}
.kpi b{font:600 32px 'Cormorant Garamond',Georgia,serif}
nav{width:244px;background:var(--side);color:var(--ink);border-right:1px solid var(--line);padding:22px 14px;gap:2px;overflow-y:auto}
nav .brand{display:flex;gap:12px;align-items:center;font:600 22px 'Cormorant Garamond',Georgia,serif;padding:2px 10px 22px;border-bottom:1px solid var(--line);margin-bottom:8px}
nav .brand small{font:400 12px Jost;color:var(--mut);opacity:1}
nav .grp{font-size:12.5px;color:var(--mut);padding:16px 12px 4px;letter-spacing:.02em}

.card{border-radius:10px}

.auth nav{display:none}.auth main{max-width:none;padding:0;width:100%}
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}

.auth-brand .wm{font:500 34px Montserrat,sans-serif;letter-spacing:.2em}.auth-brand .wm b{color:var(--green);font-weight:500}
.auth-brand .tg{font:500 11px Montserrat,sans-serif;letter-spacing:.2em;color:var(--gold);margin-top:10px;line-height:1.6}

.auth-form .btn{display:block;text-align:center;padding:12px;margin-top:18px}
.auth-form small{color:var(--mut);margin-top:16px}
.me{margin-top:auto;border-top:1px solid #ffffff22;padding:14px 10px 0;font-size:13px}.me span{display:block;color:#ffffff99}

.note{margin-bottom:12px;border-color:var(--gold)}
input[type=checkbox]{width:auto;accent-color:var(--emer)}
@media(max-width:760px){.auth-wrap{grid-template-columns:1fr}.auth-brand{padding:28px 24px}.auth-brand p{display:none}.me{margin:0 0 0 auto;border:0;padding:0}.me b,.me span{display:none}.me .btn.alt{margin:0}}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{white-space:nowrap}

a.btn{display:inline-block;cursor:pointer;text-decoration:none}

const ORTONEXA_CONFIG = { url: '', key: '' };   // <<< COLE AQUI: url = Project URL do Supabase; key = chave anon/publishable
let CFG = { url: '', key: '' }, TOKEN = null, offlineMsg = '';

try { TOKEN = localStorage.getItem('ortonexa_token'); } catch (e) { /* sem armazenamento */ }
const setToken = t => { TOKEN = t; try { if (t) localStorage.setItem('ortonexa_token', t); else localStorage.removeItem('ortonexa_token'); } catch (e) { /* segue */ } };
const infra = (msg, extra) => Object.assign(new Error(msg), { status: 0, net: true }, extra || {});
async function api(method, url, body) {
  const path = url.replace(/^\/api/, '');
  let r;
  try {
    r = await fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/api_call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: CFG.key, ...(CFG.key.startsWith('eyJ') ? { Authorization: 'Bearer ' + CFG.key } : {}) },
      body: JSON.stringify({ p_token: TOKEN, p_method: method, p_path: path, p_body: body || {} }),
    });
  } catch (e) { throw infra('Sem conexão com o banco de dados. Confira a internet e o endereço do projeto.'); }
  let j = null;
  try { j = await r.json(); } catch (e) { /* sem corpo */ }
  if (!r.ok) {
    const sqlstate = j && typeof j.code === 'string' && /^[0-9A-Z]{5}$/.test(j.code) && !j.code.startsWith('PGRST');
    if (sqlstate) throw Object.assign(new Error(j.message || 'Erro inesperado. Tente novamente.'), { status: Number(j.hint) || (j.code === '42501' ? 403 : 409) });
    if (j && (j.code === 'PGRST202' || r.status === 404)) throw infra('O banco ainda não tem a função da tela. Rode o arquivo 005_api_supabase.sql no SQL Editor do Supabase.');
    if (r.status === 401 || r.status === 403) throw infra('O Supabase recusou a chave informada. Confira a chave anon/publishable em Project Settings > API.');
    throw infra('O banco de dados não respondeu como esperado (código ' + r.status + ').');
  }
  if (j && j.__status) throw Object.assign(new Error(j.__erro), { status: j.__status });
  if (j && j.token) { setToken(j.token); delete j.token; }
  if (path === '/logout') setToken(null);
  return j;
}

async function act(fn) {
  try { await fn(); await reload(); } catch (e) { if (e.status === 401) return expired(); note = e.message; }
  render();

function dlgBox(title, body, okLabel, onok) {
  dlg.innerHTML = `<h2>${title}</h2>${body}<div id="derr" class="neg" role="alert" style="margin-top:8px;min-height:20px"></div><div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end"><button class="btn alt" id="x" type="button">Cancelar</button><button class="btn" id="ok" type="button">${okLabel}</button></div>`;
  dlg.showModal();
  dlg.addEventListener('close', () => { dlg.innerHTML = ''; }, { once: true });
  $('x').onclick = () => dlg.close();
  $('ok').onclick = async () => {
    const b = $('ok'); b.disabled = true;
    try {
      const m = await onok();
      if (m) { $('derr').textContent = m; b.disabled = false; return; }
      dlg.close(); await reload(); render();
    } catch (e) {
      if (e.status === 401) { dlg.close(); return expired(); }
      $('derr').textContent = e.message; b.disabled = false;
    }
  };
}

const jwtInfo = k => { try { return JSON.parse(atob(k.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { return null; } };
async function doConfig() {
  const key = $('c2').value.trim().replace(/^Bearer\s+/i, '');
  let url = $('c1').value.trim(), ref = '';
  const dash = url.match(/supabase\.com\/dashboard\/project\/([a-z0-9]{15,30})/i);      // colou o endereço do painel: descobre o projeto
  if (dash) ref = dash[1]; else if (/^[a-z0-9]{15,30}$/i.test(url)) ref = url;
  const info = key.split('.').length === 3 ? jwtInfo(key) : null;
  if (info && info.role === 'service_role') return er('Essa é a chave secreta (service_role) e nunca deve ficar no navegador. Copie a chave "anon public" ou "publishable".');
  if (ref) url = 'https://' + ref.toLowerCase() + '.supabase.co';
  if (!url && info && info.ref) url = 'https://' + info.ref + '.supabase.co';          // a própria chave traz o código do projeto
  try { url = new URL(url).origin; } catch (e) { url = ''; }
  if (!/^https:\/\/[^\s/]+/i.test(url)) return er('Informe o endereço do projeto (ex.: https://xxxx.supabase.co).');
  if (key.length < 20) return er('Informe a chave pública (anon ou publishable) do projeto.');
  CFG = { url, key }; try { localStorage.setItem('ortonexa_conexao', JSON.stringify(CFG)); } catch (e) { /* segue */ }
  offline = false; U = null; S = null; setToken(null); boot();
}

const lim = { hoje: [0, 0], semana: [-6, 0], mes: [-29, 0] };
const sum = a => a.reduce((t, x) => t + x.v, 0);
const gate = (c, html) => c ? html : '';

function dash() {
  const [a, b] = lim[per];
  const T = S.titulos, Q = S.orcamentos;
  const rec = sum(T.filter(i => i.pago && i.pago_em && off(i.pago_em) >= a && off(i.pago_em) <= b));
  const pend = T.filter(i => !i.pago), prev = sum(pend.filter(i => off(i.venc) >= 0)), vcd = sum(pend.filter(i => off(i.venc) < 0));
  const contr = Q.filter(q => q.plano).reduce((t, q) => t + q.sub - q.descto, 0);
  const abertos = Q.filter(q => ['Enviado', 'Em negociação'].includes(q.st));
  const hoje = S.agenda.filter(x => x.dia === TODAY), conf = hoje.filter(x => ['conf', 'atend', 'conc'].includes(x.st)).length;
  const inativos = S.pacientes.filter(p => p.ativo && p.ult && off(p.ult) < -180);
  const semDecisao = abertos.filter(q => q.dias >= 7);
  const retorno = [...semDecisao.map(q => `<div class="row"><div>${esc(pn(q.pid))}<small>Orçamento sem decisão há ${q.dias} dias · ${brl(q.sub - q.descto)}</small></div></div>`),
    ...inativos.map(p => `<div class="row"><div>${esc(p.nome)}<small>Sem atendimento há ${-off(p.ult)} dias</small></div></div>`),
    ...pend.filter(i => off(i.venc) < 0).map(i => `<div class="row"><div>${esc(pn(i.pid))}<small>Parcela ${i.n} vencida · ${brl(i.v)}</small></div></div>`)];
  const kpi = [
    can('fin') && `<div class="card kpi main"><span>Recebido no período</span><b>${brl(rec)}</b></div>`,
    can('orc') && `<div class="card kpi"><span>Contratado (planos aprovados)</span><b>${brl(contr)}</b></div>`,
    can('fin') && `<div class="card kpi"><span>Previsto a receber</span><b>${brl(prev)}</b></div>`,
    can('fin') && `<div class="card kpi"><span>Em atraso</span><b class="neg">${brl(vcd)}</b></div>`,
    can('orc') && `<div class="card kpi"><span>Orçamentos em aberto</span><b>${abertos.length}</b></div>`,
    can('agenda') && `<div class="card kpi"><span>Confirmados hoje</span><b>${conf} de ${hoje.length}</b></div>`,
  ].filter(Boolean).join('');
  return `<div class="top"><div><h1>Olá, ${esc(U.nome.split(' ')[0])}!</h1><p>${esc(U.clinica)} · ${esc(U.grupo)}</p></div>
  ${can('fin') ? `<div class="chips" role="group" aria-label="Período">${[['hoje', 'Hoje'], ['semana', 'Semana'], ['mes', 'Mês']].map(([k, l]) => `<button class="chip" data-a="per" data-v="${k}" aria-pressed="${per === k}">${l}</button>`).join('')}</div>` : ''}</div>
  ${kpi ? `<div class="grid">${kpi}</div>` : ''}
  <div class="two">${gate(can('agenda'), `<div class="card"><h3>Agenda de hoje</h3>${hoje.length ? '' : mut + 'Nenhum atendimento agendado.</p>'}${hoje.map(x => `<div class="row"><div>${x.hora} · ${esc(pn(x.pid))}<small>${esc(x.proc || 'Procedimento não informado')} · ${esc(x.prof)}</small></div>${tag(x.st)}</div>`).join('')}</div>`)}
  ${gate(can('orc') || can('fin') || can('pac') || can('rec'), `<div class="card"><h3>Para recuperar</h3>${can('rec') ? '<p style="margin:0 0 8px"><button class="btn alt" data-a="go" data-v="rec">Abrir fila de recuperação</button></p>' : ''}${retorno.length ? retorno.join('') : mut + 'Nada para recuperar no momento.</p>'}</div>`)}</div>
  ${kpi || can('agenda') ? '' : '<div class="card soon"><h3>Bem-vindo</h3><p style="color:var(--mut)">Seu grupo ainda não tem módulos liberados. Peça ao administrador.</p></div>'}`;
}

function novoOrc(pre) {

function aprovar(id) {

function cx() {
  const M = Array.from({ length: 6 }, (_, i) => new Date(T0.getFullYear(), T0.getMonth() - 5 + i, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''));
  const ym = s => { const [y, m] = s.split('-'); return +y * 12 + (+m - 1); }, base = T0.getFullYear() * 12 + T0.getMonth();
  const E = Array(6).fill(0), Sd = Array(6).fill(0);
  S.caixa.forEach(m => { const k = 5 + ym(m.d) - base; if (k >= 0 && k <= 5) (m.t === 'entrada' ? E : Sd)[k] += m.v; });
  const mx = Math.max(1, ...E, ...Sd), e = E[5], sa = Sd[5], C = 2 * Math.PI * 54;
  const bars = M.map((m, i) => { const x = 24 + i * 66, he = E[i] / mx * 150, hs = Sd[i] / mx * 150; return `<rect x="${x}" y="${165 - he}" width="22" height="${he}" rx="3" fill="var(--emer)"/><rect x="${x + 25}" y="${165 - hs}" width="22" height="${hs}" rx="3" fill="var(--gold)"/><text x="${x + 23}" y="184" text-anchor="middle" font-size="11" fill="var(--mut)">${m}</text>`; }).join('');
  return `<div class="top"><div><h1>Fluxo de caixa</h1><p>Realizado, sem misturar com o previsto.</p></div>
  ${can('cx', 'c') ? '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" data-a="lan" data-v="entrada">Lançar entrada</button><button class="btn" data-a="lan" data-v="saida">Lançar despesa</button></div>' : ''}</div>
  <div class="two"><div class="card"><h3>Entradas e saídas por mês</h3><svg viewBox="0 0 420 195" width="100%" role="img" aria-label="Barras de entradas e saídas dos últimos seis meses">${bars}</svg>
  <div class="legend"><span class="tag" style="background:var(--emer);color:#fff">Entradas</span><span class="tag" style="background:var(--gold);color:#0B0B0B">Saídas</span></div></div>
  <div class="card"><h3>Mês atual</h3><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:8px">
  <svg viewBox="0 0 140 140" width="150" role="img" aria-label="Proporção entre entradas e saídas"><circle cx="70" cy="70" r="54" fill="none" stroke="${e + sa ? 'var(--gold)' : 'var(--line)'}" stroke-width="22"/><circle cx="70" cy="70" r="54" fill="none" stroke="var(--emer)" stroke-width="22" stroke-dasharray="${(e + sa ? e / (e + sa) : 0) * C} ${C}" transform="rotate(-90 70 70)"/></svg>
  <div><div class="row"><span>Entradas</span><b>${brl(e)}</b></div><div class="row"><span>Saídas</span><b>${brl(sa)}</b></div><div class="row"><span>Saldo</span><b>${brl(e - sa)}</b></div></div></div></div></div>
  <div class="card scroll" style="margin-top:12px"><h3 style="margin-bottom:8px">Últimas movimentações</h3><table><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr>
  ${S.caixa.slice(0, 12).map(m => `<tr><td>${fdi(m.d)}</td><td>${esc(m.descr)}</td><td>${m.t === 'entrada' ? 'Entrada' : 'Saída'}</td><td>${m.t === 'entrada' ? '' : '− '}${brl(m.v)}</td></tr>`).join('') || '<tr><td colspan="4">Nenhuma movimentação realizada ainda.</td></tr>'}</table></div>`;
}

const MOTIVO = { paciente_inativo: 'Paciente inativo', orcamento_sem_decisao: 'Orçamento sem decisão', tratamento_interrompido: 'Tratamento interrompido', falta: 'Falta', retorno_preventivo: 'Retorno preventivo', consulta_sem_confirmacao: 'Consulta sem confirmação', cobranca: 'Cobrança' };

const TSTAT = { aberta: 'Aberta', em_andamento: 'Em andamento', concluida: 'Concluída', cancelada: 'Dispensada' };
let rf = 'abertas', rm = '';
const patOf = id => S.pacientes.find(p => p.id === id) || { nome: '—', ativo: false };
const waLink = (tel, texto) => { const d = String(tel || '').replace(/\D/g, ''), n = d.length === 10 || d.length === 11 ? '55' + d : d; return n.length >= 12 ? 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto) : null; };

function rec() {
  const R = S.recup, abertas = R.filter(t => ['aberta', 'em_andamento'].includes(t.st));
  const atras = abertas.filter(t => off(t.prazo) < 0).length, c7 = S.contatos.filter(c => off(c.dia) >= -6).length;
  const recup = R.filter(t => t.st === 'concluida' && t.resultado === 'agendou').length;

function msg(id) {
  const t = S.recup.find(x => x.id === id), p = patOf(t.pid);
  dlgBox('Mensagem de WhatsApp', `<p style="color:var(--mut);margin:4px 0">${esc(p.nome)} · ${esc(p.tel || '')}</p><label for="d1">Mensagem (você pode editar)</label><textarea id="d1" rows="6"></textarea>
    <p style="color:var(--mut);font-size:13px;margin:10px 0 0">O WhatsApp abre com o texto pronto. Depois de enviar, volte e use "Registrar contato".</p>`, 'Abrir WhatsApp',
    () => { const link = waLink(p.tel, $('d1').value); if (!link) return 'Telefone inválido para WhatsApp. Confira o cadastro do paciente.'; window.open(link, '_blank', 'noopener'); });
  $('d1').value = modelo(p, t.motivo);
}
function hist(pid) {
  const p = patOf(pid), L = S.contatos.filter(c => c.pid === pid);
  dlgBox('Histórico de contatos', `<p style="color:var(--mut);margin:4px 0">${esc(p.nome)}</p>${L.length ? `<div class="tl" style="margin-top:12px">${L.map(c => `<div>${CANAL[c.canal] || esc(c.canal)} · ${RESULT[c.resultado] || esc(c.resultado)}<small>${fdi(c.dia)} · ${esc(c.usuario || '—')}${c.obs ? ' · ' + esc(c.obs) : ''}</small></div>`).join('')}</div>` : mut + 'Nenhum contato registrado.</p>'}`, 'Fechar', async () => {});
}
function fechar(id, st) {
  const t = S.recup.find(x => x.id === id), p = patOf(t.pid), conclui = st === 'concluida';
  dlgBox(conclui ? 'Concluir tarefa' : 'Dispensar tarefa', `<p style="margin:4px 0">${esc(p.nome)} · ${MOTIVO[t.motivo]}</p>${!conclui ? '<p style="color:var(--mut)">A tarefa sai da fila sem registrar contato.</p>' : ''}${fld('d1', 'Observação (opcional)')}`, conclui ? 'Concluir' : 'Dispensar',
    async () => { await api('PATCH', `/api/recovery/${id}/status`, { status: st, motivo: gv('d1') }); });
}
function novaTarefa() {
  const PA = S.pacientes.filter(p => p.ativo);
  if (!PA.length) { note = 'Cadastre um paciente antes de criar tarefas.'; return render(); }
  dlgBox('Nova tarefa de recuperação', `<label for="d1">Paciente</label><select id="d1">${PA.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>
    <label for="d2">Motivo</label><select id="d2">${Object.entries(MOTIVO).map(([k, l]) => `<option value="${k}"${k === 'retorno_preventivo' ? ' selected' : ''}>${l}</option>`).join('')}</select>${fld('d3', 'Prazo', 'date')}${fld('d4', 'Observação (opcional)')}`, 'Criar tarefa',
    async () => { if (!gv('d3')) return 'Informe o prazo.'; await api('POST', '/api/recovery', { pacienteId: $('d1').value, motivo: $('d2').value, prazo: gv('d3'), obs: gv('d4') }); });
  $('d3').value = TODAY;
}

// ------------------------------------------------------------ edições, cancelamentos e estornos
function reag(id) {
  const x = S.agenda.find(y => y.id === id);
  dlgBox('Reagendar', `<p style="color:var(--mut);margin:4px 0">${esc(pn(x.pid))} · ${esc(x.proc || 'Procedimento não informado')}</p>` + fld('d2', 'Profissional', 'text', 'list="dprof" autocomplete="off"') +
    `<datalist id="dprof">${S.profissionais.map(p => `<option value="${esc(p.nome)}">`).join('')}</datalist>` + fld('d4', 'Data', 'date') + fld('d5', 'Horário', 'time') + fld('d6', 'Duração (minutos)', 'number', 'min="5" max="600" step="5"'), 'Reagendar',
    async () => {
      if (!gv('d2')) return 'Informe o profissional.'; if (!gv('d4') || !gv('d5')) return 'Informe a data e o horário.';
      await api('PATCH', `/api/appointments/${id}`, { profissional: gv('d2'), dia: gv('d4'), hora: gv('d5'), duracao: Number($('d6').value) || 30 });
    });
  $('d2').value = x.prof; $('d4').value = x.dia; $('d5').value = x.hora; $('d6').value = x.dur || 30;
}
function cancAg(id) {
  const x = S.agenda.find(y => y.id === id);
  dlgBox('Cancelar agendamento', `<p style="margin:4px 0">${esc(pn(x.pid))} · ${fdi(x.dia)} às ${x.hora}</p>` + fld('d1', 'Motivo (opcional)'), 'Cancelar agendamento',
    async () => { await api('POST', `/api/appointments/${id}/cancel`, { motivo: gv('d1') }); });
}
function editPac(id) {
  const p = S.pacientes.find(x => x.id === id);
  dlgBox('Editar paciente', fld('d1', 'Nome') + fld('d2', 'Telefone / WhatsApp', 'tel') + `<label for="d3">Origem</label><select id="d3"><option value="">Não informada</option>${opts(['Indicação', 'Instagram', 'Site', 'Campanha', 'Outra'], p.origem)}</select>` + chk('d4', 'Autoriza contato por mensagem (WhatsApp, SMS, e-mail)') + chk('d5', 'Bloquear qualquer comunicação com este paciente'), 'Salvar',
    async () => { if (!gv('d1')) return 'Informe o nome.'; await api('PATCH', `/api/patients/${id}`, { nome: gv('d1'), tel: gv('d2'), origem: $('d3').value || null, ativo: p.ativo, consent: $('d4').checked, bloq: $('d5').checked }); });
  $('d1').value = p.nome; $('d2').value = p.tel || ''; $('d4').checked = !!p.consent; $('d5').checked = !!p.bloq;
}
function editProc(id) {
  const x = S.procedimentos.find(y => y.id === id);
  dlgBox('Editar procedimento', fld('d1', 'Nome') + fld('d2', 'Valor padrão (R$)', 'number', 'min="0" step="0.01"') + fld('d3', 'Duração (minutos)', 'number', 'min="5" max="600" step="5"') +
    '<p style="color:var(--mut);font-size:13px;margin:10px 0 0">Orçamentos já criados mantêm o preço da época.</p>', 'Salvar',
    async () => { if (!gv('d1')) return 'Informe o nome.'; await api('PATCH', `/api/procedures/${id}`, { nome: gv('d1'), valor: money('d2'), dur: Number($('d3').value) || 30, ativo: x.ativo }); });
  $('d1').value = x.nome; $('d2').value = (x.valor / 100).toFixed(2); $('d3').value = x.dur || 30;
}
function recusar(id) {
  const q = S.orcamentos.find(x => x.id === id);
  dlgBox('Recusar orçamento', `<p style="margin:4px 0">${esc(q.code)} · ${esc(pn(q.pid))} · ${brl(q.sub - q.descto)}</p>` + fld('d1', 'Motivo (opcional)'), 'Marcar como recusado',
    async () => { await api('PATCH', `/api/quotes/${id}/status`, { status: 'recusado', motivo: gv('d1') }); });
}
function estornar(id) {
  const i = S.titulos.find(x => x.id === id);
  dlgBox('Estornar pagamento', `<p style="margin:4px 0">${esc(i.code)} · ${esc(pn(i.pid))} · ${brl(i.v)}</p><p style="color:var(--mut)">O título volta a ficar pendente e a entrada sai do fluxo de caixa. O estorno fica registrado na auditoria.</p>` + fld('d1', 'Motivo do estorno'), 'Estornar',
    async () => { if (!gv('d1')) return 'Informe o motivo do estorno.'; await api('POST', `/api/installments/${id}/reverse`, { motivo: gv('d1') }); });
}
function editConta(id) {
  const x = S.contas.find(y => y.id === id);
  dlgBox('Editar conta a pagar', fld('d1', 'Descrição') + `<label for="d2">Categoria</label><select id="d2">${opts(CATS.includes(x.cat) ? CATS : [x.cat, ...CATS], x.cat)}</select>` + fld('d3', 'Fornecedor') + fld('d4', 'Valor (R$)', 'number', 'min="0" step="0.01"') + fld('d5', 'Vencimento', 'date') +
    '<label for="d6">Repete</label><select id="d6"><option value="">Não se repete</option><option value="semanal">Semanal</option><option value="mensal">Mensal</option><option value="anual">Anual</option></select>', 'Salvar',
    async () => {
      if (!gv('d1')) return 'Informe a descrição.'; if (money('d4') <= 0) return 'Informe um valor maior que zero.'; if (!gv('d5')) return 'Informe o vencimento.';
      await api('PATCH', `/api/payables/${id}`, { descr: gv('d1'), cat: $('d2').value, forn: gv('d3'), valor: money('d4'), venc: gv('d5'), rec: $('d6').value || null });
    });
  $('d1').value = x.descr; $('d3').value = x.forn || ''; $('d4').value = (x.v / 100).toFixed(2); $('d5').value = x.venc; $('d6').value = x.rec || '';
}

// ------------------------------------------------------------ ações dos botões e campos
const ACT = {
  per: d => { per = d.v; render(); },
  adia: d => { adia = d.v === '0' ? 0 : Math.max(-60, Math.min(60, adia + Number(d.v))); render(); },
  st: d => act(() => api('PATCH', `/api/appointments/${d.id}/status`, { status: d.v })),
  novoAg: d => novoAg(d.pid), novoOrc: d => novoOrc(d.pid), novoPac, novoProc, novoUser, novoGrupo, novaConta,
  go: d => { view = d.v; sel = null; render(); },
  gerar: () => act(async () => { const r = await api('POST', '/api/recovery/generate'); note = r.novas ? `${r.novas} nova(s) tarefa(s) na fila.` : 'Nenhuma tarefa nova: a fila já está atualizada.'; }),
  novaTarefa, contato: d => contato(d.id), msg: d => msg(d.id), hist: d => hist(d.id), fechar: d => fechar(d.id, d.v),
  rf: d => { rf = d.v; render(); }, assumir: d => act(() => api('POST', `/api/recovery/${d.id}/assume`)),
  reag: d => reag(d.id), cancAg: d => cancAg(d.id), editPac: d => editPac(d.id), editProc: d => editProc(d.id), editConta: d => editConta(d.id),
  negociar: d => act(() => api('PATCH', `/api/quotes/${d.id}/status`, { status: 'em_negociacao' })), recusar: d => recusar(d.id), estornar: d => estornar(d.id),
  togPac: d => { const p = S.pacientes.find(x => x.id === d.id); act(() => api('PATCH', `/api/patients/${d.id}`, { nome: p.nome, tel: p.tel || null, origem: p.origem || null, ativo: d.v === '1', consent: !!p.consent, bloq: !!p.bloq })); },
  togProc: d => { const x = S.procedimentos.find(y => y.id === d.id); act(() => api('PATCH', `/api/procedures/${d.id}`, { nome: x.nome, valor: x.valor, dur: x.dur || 30, ativo: d.v === '1' })); },
  pac: d => { sel = d.id; render(); },
  back: () => { sel = null; render(); },
  aprovar: d => aprovar(d.id),
  pagar: d => act(() => api('POST', `/api/installments/${d.id}/pay`)),
  lan: d => lancar(d.v),
  pf: d => { pf = d.v; render(); },
  baixa: d => baixa(d.id),
  cancelaConta: d => cancelaConta(d.id),
  utab: d => { utab = d.v; render(); },
  gsel: d => { gsel = d.id; render(); },
  resetPw: d => resetPw(d.id),
  toggleUser: d => act(() => api('PATCH', `/api/users/${d.id}`, { ativo: d.v === '1' })),
  delGrupo: d => act(async () => { await api('DELETE', `/api/groups/${d.id}`); gsel = null; }),
};
const CHG = {
  rm: el => { rm = el.value; render(); },
  ug: el => act(() => api('PATCH', `/api/users/${el.dataset.id}`, { grupoId: el.value })),
  pm: el => {
    const G = S.grupos.find(g => g.id === el.dataset.id), m = el.dataset.m, p = Object.assign({ v: false, c: false, e: false, d: false }, G.p[m]);
    p[el.dataset.k] = el.checked;
    if (el.dataset.k === 'v' && !el.checked) p.c = p.e = p.d = false;
    else if (el.dataset.k !== 'v' && el.checked) p.v = true;
    act(() => api('PUT', `/api/groups/${G.id}/permissions/${m}`, p));
  },
};
app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && ACT[b.dataset.a]) ACT[b.dataset.a](b.dataset); });
app.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && CHG[el.dataset.c]) CHG[el.dataset.c](el); });
app.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  busca = e.target.value; const pos = e.target.selectionStart; render();
  const q = $('q'); q.focus(); q.setSelectionRange(pos, pos);
});
nav.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.out !== undefined) return sair();
  if (b.dataset.v) { view = b.dataset.v; sel = null; render(); }
});

// ------------------------------------------------------------ montagem
function render() {
  if (!CFG.url || !CFG.key || configuring) {
    document.body.classList.add('auth'); nav.innerHTML = ''; app.innerHTML = configScreen();
    $('cok').onclick = () => { configuring = false; doConfig(); };
    app.querySelectorAll('#af input').forEach(i => { i.onkeydown = ev => { if (ev.key === 'Enter') { configuring = false; doConfig(); } }; });
    return;
  }
  if (offline) {
    document.body.classList.add('auth'); nav.innerHTML = ''; app.innerHTML = offlineScreen();
    $('retry').onclick = () => { offline = false; boot(); };
    if ($('chg')) $('chg').onclick = () => { configuring = true; render(); };
    return;
  }
  if (!U) {
    document.body.classList.add('auth'); nav.innerHTML = ''; app.innerHTML = authScreen();
    try { $(needsSetup ? 'a1' : 'a3').focus(); } catch (e) { /* segue */ }
    $('ab').onclick = doAuth;
    app.querySelectorAll('#af input').forEach(i => { i.onkeydown = ev => { if (ev.key === 'Enter') doAuth(); }; });
    return;
  }
  document.body.classList.remove('auth');
  const items = NAVS.map(([g, l]) => [g, l.filter(k => can(k))]).filter(([, l]) => l.length);
  nav.innerHTML = `<div class="brand"><img src="${LOGO}" alt="ORTONEXA"><div class="wm">ORTO<b>NEXA</b></div><div class="tg">GESTÃO INTELIGENTE<br>PARA CLÍNICAS</div></div>`
    + items.map(([g, l]) => `<div class="grp">${g}</div>` + l.map(k => `<button data-v="${k}" ${view === k ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${LABEL[k]}</button>`).join('')).join('')
    + `<div class="me"><b>${esc(U.nome)}</b><span>${esc(U.grupo)}</span><button class="btn alt" data-out>Sair</button></div>`;
  if (!can(view)) view = firstView();
  const soon = k => `<div class="top"><div><h1>${LABEL[k]}</h1></div></div><div class="card soon"><h3>Próxima etapa</h3><p style="color:var(--mut)">${SOON[k]}</p></div>`;
  const V = { dash, agenda, pac: pacs, proc: procs, orc, rec, fin: finan, cx, pag, usr, cfg: cfgView };
  const n = note; note = '';
  app.innerHTML = (n ? `<div class="card note" role="status">${esc(n)}</div>` : '') + (can(view) ? (V[view] || (() => soon(view)))() : '<div class="top"><div><h1>Acesso restrito</h1><p>O seu grupo não tem permissão para este módulo.</p></div></div>');
}

async function boot() {
  if (!CFG.url || !CFG.key) return render();
  try {
    const s = await api('GET', '/api/session');
    needsSetup = s.needsSetup;
    if (s.autenticado) { await reload(); view = firstView(); }
  } catch (e) { if (e.net) { offline = true; offlineMsg = e.message; } else { offline = true; offlineMsg = e.message; } }
  render();
}

function cfgView() {
  let host = CFG.url; try { host = new URL(CFG.url).host; } catch (e) { /* mostra como está */ }
  return `<div class="top"><div><h1>Configurações</h1><p>Dados da clínica, prazos de recuperação e automações ficam para a próxima etapa.</p></div></div>
  ${ORTONEXA_CONFIG.url ? '' : `<div class="card" style="max-width:680px"><h3>Conexão com o banco de dados</h3><p style="color:var(--mut)">Projeto conectado: <b>${esc(host)}</b></p>
  ${can('cfg', 'e') ? '<div class="acts"><button class="btn alt" data-a="trocaConexao">Alterar conexão</button></div>' : ''}</div>`}`;
}
Object.assign(ACT, { trocaConexao: () => { configuring = true; render(); } });

boot();

</script>
</body>
</html>
