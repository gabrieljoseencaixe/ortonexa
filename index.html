<style>

.neg{color:#B3342B}@media (prefers-color-scheme:dark){.neg{color:#F09B93}}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}nav .brand{display:none}nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}nav button[aria-current=page]{border-bottom-color:var(--gold)}}

h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}

:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#0B0B0B;--mut:#53665E;--line:#E2ECE6;--green:#A7D7C1;--emer:#1E7D62;--dark:#0F3D34;--gold:#D4AF37;--soft:#F1F8F4;--side:#0F3D34;--warn:#F4E6B0;--blue:#1E7D62;--grey:#E4E8E6;--red:#F2C4BE;--tagink:#0B0B0B}

body{font-family:Inter,system-ui,sans-serif}

.auth nav{display:none}.auth main{max-width:none;padding:0;width:100%}
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}

<body>
<nav id="nav" aria-label="Principal"></nav>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const D=864e5, T0=new Date(); T0.setHours(0,0,0,0);
const day=n=>new Date(+T0+n*D);
const fd=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ST={aguard:'Aguardando confirmação',conf:'Confirmado',atend:'Em atendimento',conc:'Concluído',falta:'Falta'};
const NEXT={aguard:'conf',conf:'atend',atend:'conc'};
const NEXTL={aguard:'Confirmar',conf:'Iniciar',atend:'Concluir'};
let pat=[];
let proc=[];
let ap=[];
let qt=[];
let ins=[];
const fin=q=>q.sub-q.desc;
const venc=i=>i.st==='pendente'&&i.venc<0;
let view='dash',per='mes',sel=null,busca='';

const IC={usr:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.500 3-5.500 7-5.500M16 11l5 2v4c0 2.500-2 4-5 5-3-1-5-2.500-5-5v-4z"/>',cx:'<path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/>',dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',pac:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',proc:'<path d="M7 3C4.500 3 3 5 3 7.500c0 3 1.500 4.500 2 7 .5 3 1 6 2.500 6s1.500-4 3.500-4 2 4 3.500 4 2-3 2.500-6c.5-2.500 2-4 2-7C20 5 18.500 3 16 3c-2 0-2.500 1-4 1S9 3 7 3z"/>',orc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',rec:'<path d="M3 12a9 9 0 0 1 15-6.700L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.700L3 16M3 21v-5h5"/>',fin:'<circle cx="12" cy="12" r="9"/><path d="M14.500 9.500C14 8.500 13 8 12 8c-1.500 0-2.500.8-2.500 1.800s1 1.500 2.500 2 2.500 1 2.500 2.200S13.500 16 12 16c-1 0-2-.5-2.500-1.500M12 6.500V8M12 16v1.500"/>',pag:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.500"/>',rel:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',cfg:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900L7 7M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"/>'};
const NAVS=[['Rotina',[['dash','Início'],['agenda','Agenda'],['pac','Pacientes'],['proc','Procedimentos']]],['Comercial',[['orc','Orçamentos'],['rec','Recuperação']]],['Caixa',[['fin','Financeiro'],['cx','Fluxo de caixa'],['pag','Contas a pagar']]],['Gestão',[['rel','Relatórios'],['cfg','Configurações'],['usr','Usuários e permissões']]]];
const SOON={rec:['Recuperação','Fila de retorno com pacientes inativos, orçamentos sem decisão, faltas e retornos preventivos, registro de contato e modelos de mensagem.'],pag:['Contas a pagar','Despesas por categoria, fornecedor e recorrência, com fluxo de caixa realizado e projetado em visões separadas.'],rel:['Relatórios','Indicadores com fórmulas documentadas, filtros por profissional, procedimento e origem, e exportação em XLSX, CSV e PDF.'],cfg:['Configurações','Usuários, perfis e permissões por módulo, prazos de recuperação, automações e dados da clínica.']};
const soon=k=>`<div class="top"><div><h1>${SOON[k][0]}</h1></div></div><div class="card soon"><h3>Próxima etapa do protótipo</h3><p style="color:var(--mut)">${SOON[k][1]}</p></div>`;

let pg=[],cxl=[],pf='todas';
const CATS=['Aluguel e condomínio','Materiais odontológicos','Laboratório protético','Folha e encargos','Impostos e taxas','Marketing','Equipamentos e manutenção','Outras despesas'];
const REC={semanal:'Semanal',mensal:'Mensal',anual:'Anual'};
const ISO=()=>new Date(+T0-T0.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const off=v=>Math.round((new Date(v+'T00:00:00')-T0)/D);
const money=id=>Math.round((+document.getElementById(id).value||0)*100);
const opts=a=>a.map(c=>`<option>${esc(c)}</option>`).join('');
const pst=x=>x.st==='pago'?['conf','Paga']:x.st==='cancelado'?['conc','Cancelada']:x.venc<0?['falta','Vencida']:['aguard','A vencer'];
function movs(){
 return [...ins.filter(i=>i.st==='pago').map(i=>({d:i.pago,t:'entrada',desc:'Recebimento · '+(pat[i.p]?pat[i.p].nome:'')+' (parcela '+i.n+')',v:i.v})),
  ...pg.filter(x=>x.st==='pago').map(x=>({d:x.pagoEm,t:'saida',desc:x.desc,v:x.pagoV})),
  ...cxl.map(x=>({d:x.d,t:x.t,desc:x.desc,v:x.v}))].sort((a,b)=>b.d-a.d);
}
function pag(){
 const aberto=pg.filter(x=>x.st==='pendente'),vc=aberto.filter(x=>x.venc<0),sum=a=>a.reduce((t,x)=>t+x.v,0);
 const mes=pg.filter(x=>x.st==='pago'&&x.pagoEm>=-29).reduce((t,x)=>t+x.pagoV,0);
 const lista=pg.filter(x=>pf==='todas'||(pf==='abertas'&&x.st==='pendente')||(pf==='vencidas'&&x.st==='pendente'&&x.venc<0)||(pf==='pagas'&&x.st==='pago')).sort((a,b)=>a.venc-b.venc);
 return `<div class="top"><div><h1>Contas a pagar</h1><p>Lance as despesas e dê baixa quando pagar. O que for pago entra no fluxo de caixa.</p></div>${can('pag','c')?'<button class="btn" data-pnew>Nova conta</button>':''}</div>
 <div class="grid"><div class="card kpi main"><span>Em aberto</span><b>${brl(sum(aberto))}</b></div><div class="card kpi"><span>Vencidas</span><b class="neg">${brl(sum(vc))}</b></div><div class="card kpi"><span>Pago nos últimos 30 dias</span><b>${brl(mes)}</b></div></div>
 <div class="chips" style="margin-bottom:12px" role="group" aria-label="Filtro">${[['todas','Todas'],['abertas','Em aberto'],['vencidas','Vencidas'],['pagas','Pagas']].map(([k,l])=>`<button class="chip" data-pf="${k}" aria-pressed="${pf===k}">${l}</button>`).join('')}</div>
 <div class="card scroll"><table><tr><th>Descrição</th><th>Categoria</th><th>Fornecedor</th><th>Vencimento</th><th>Valor</th><th>Repete</th><th>Status</th><th></th></tr>
 ${lista.length?'':'<tr><td colspan="8">'+(pg.length?'Nenhuma conta neste filtro.':'Nenhuma conta lançada. Use "Nova conta".')+'</td></tr>'}
 ${lista.map(x=>{const [c,t]=pst(x);return `<tr><td>${esc(x.desc)}</td><td>${esc(x.cat)}</td><td>${esc(x.forn||'—')}</td><td>${fd(day(x.venc))}</td><td>${brl(x.v)}</td><td>${REC[x.rec]||'Não'}</td><td><span class="tag s-${c}">${t}</span></td><td>${x.st==='pendente'&&can('pag','e')?`<button class="btn alt" data-pbx="${x.id}">Dar baixa</button> <button class="btn alt" data-pcn="${x.id}">Cancelar</button>`:''}</td></tr>`}).join('')}</table></div>`;
}
function cx(){
 const M=Array.from({length:6},(_,i)=>new Date(T0.getFullYear(),T0.getMonth()-5+i,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.',''));
 const ym=d=>d.getFullYear()*12+d.getMonth(),E=Array(6).fill(0),S=Array(6).fill(0),L=movs();
 L.forEach(m=>{const k=5+ym(day(m.d))-ym(T0);if(k>=0&&k<=5)(m.t==='entrada'?E:S)[k]+=m.v});
 const mx=Math.max(1,...E,...S),e=E[5],sa=S[5],C=2*Math.PI*54;
 const bars=M.map((m,i)=>{const x=24+i*66,he=E[i]/mx*150,hs=S[i]/mx*150;return `<rect x="${x}" y="${165-he}" width="22" height="${he}" rx="3" fill="var(--emer)"/><rect x="${x+25}" y="${165-hs}" width="22" height="${hs}" rx="3" fill="var(--gold)"/><text x="${x+23}" y="184" text-anchor="middle" font-size="11" fill="var(--mut)">${m}</text>`}).join('');
 return `<div class="top"><div><h1>Fluxo de caixa</h1><p>Realizado, sem misturar com o previsto.</p></div>
 ${can('cx','c')?'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" data-lan="entrada">Lançar entrada</button><button class="btn" data-lan="saida">Lançar despesa</button></div>':''}</div>
 <div class="two"><div class="card"><h3>Entradas e saídas por mês</h3><svg viewBox="0 0 420 195" width="100%" role="img" aria-label="Barras de entradas e saídas dos últimos seis meses">${bars}</svg>
 <div class="legend"><span class="tag" style="background:var(--emer);color:#fff">Entradas</span><span class="tag" style="background:var(--gold);color:#0B0B0B">Saídas</span></div></div>
 <div class="card"><h3>Mês atual</h3><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:8px">

function novaConta(){
 dlgBox('Nova conta a pagar',fld('d1','Descrição')+`<label for="d2">Categoria</label><select id="d2">${opts(CATS)}</select>`+fld('d3','Fornecedor')+fld('d4','Valor (R$)','number')+fld('d5','Vencimento','date')+`<label for="d6">Repete</label><select id="d6"><option value="">Não se repete</option><option value="semanal">Semanal</option><option value="mensal">Mensal</option><option value="anual">Anual</option></select>`,'Lançar conta',()=>{
  const desc=gv('d1'),v=money('d4'),dt=gv('d5');
  if(!desc)return 'Informe a descrição.';
  if(v<=0)return 'Informe um valor maior que zero.';
  if(!dt)return 'Informe o vencimento.';
  pg.push({id:rnd(),desc,cat:document.getElementById('d2').value,forn:gv('d3'),v,venc:off(dt),rec:document.getElementById('d6').value,st:'pendente'});
 });
 const a=document.getElementById('d4');a.step='0.01';a.min='0';document.getElementById('d5').value=ISO();
}
function lancar(t){
 const S=t==='saida';
 dlgBox(S?'Lançar despesa':'Lançar entrada',fld('d1','Descrição')+`<label for="d2">Categoria</label><select id="d2">${opts(S?CATS:['Recebimento avulso','Outras entradas'])}</select>`+fld('d4','Valor (R$)','number')+fld('d5','Data do lançamento','date'),S?'Lançar despesa':'Lançar entrada',()=>{
  const desc=gv('d1'),v=money('d4'),dt=gv('d5');
  if(!desc)return 'Informe a descrição.';
  if(v<=0)return 'Informe um valor maior que zero.';
  if(!dt||off(dt)>0)return 'Informe a data de hoje ou anterior: o lançamento já foi realizado.';
  cxl.push({t,desc,cat:document.getElementById('d2').value,v,d:off(dt)});
 });
 const a=document.getElementById('d4');a.step='0.01';a.min='0';document.getElementById('d5').value=ISO();
}
function baixa(id){
 const x=pg.find(y=>y.id===id);
 dlgBox('Dar baixa',`<p style="color:var(--mut);margin:4px 0">${esc(x.desc)} · vence em ${fd(day(x.venc))}</p>`+fld('d4','Valor pago (R$)','number')+fld('d5','Data do pagamento','date'),'Confirmar pagamento',()=>{
  const v=money('d4'),dt=gv('d5');
  if(v<=0)return 'Informe um valor maior que zero.';
  if(!dt||off(dt)>0)return 'Informe a data de hoje ou anterior.';
  x.st='pago';x.pagoV=v;x.pagoEm=off(dt);
  if(x.rec){const n=new Date(day(x.venc));if(x.rec==='semanal')n.setDate(n.getDate()+7);else if(x.rec==='mensal')n.setMonth(n.getMonth()+1);else n.setFullYear(n.getFullYear()+1);
   pg.push({...x,id:rnd(),venc:Math.round((n-T0)/D),st:'pendente',pagoV:0,pagoEm:0})}
 });
 const a=document.getElementById('d4');a.step='0.01';a.min='0';a.value=(x.v/100).toFixed(2);document.getElementById('d5').value=ISO();
}
function cancelarConta(id){
 const x=pg.find(y=>y.id===id);
 dlgBox('Cancelar conta',`<p style="margin:4px 0">${esc(x.desc)} · ${brl(x.v)}</p><p style="color:var(--mut)">A conta deixa de contar como a pagar e não entra no fluxo de caixa.</p>`,'Cancelar esta conta',()=>{x.st='cancelado'});
}
function bindPag(){
 const q=(s,f)=>app.querySelectorAll(s).forEach(f);
 q('[data-pnew]',b=>b.onclick=novaConta);
 q('[data-pf]',b=>b.onclick=()=>{pf=b.dataset.pf;render()});
 q('[data-pbx]',b=>b.onclick=()=>baixa(b.dataset.pbx));
 q('[data-pcn]',b=>b.onclick=()=>cancelarConta(b.dataset.pcn));
 q('[data-lan]',b=>b.onclick=()=>lancar(b.dataset.lan));
}

const BRAND='<div class="brand"><img src="'+LOGO+'" alt="ORTONEXA"><div class="wm">ORTO<b>NEXA</b></div><div class="tg">GESTÃO INTELIGENTE<br>PARA CLÍNICAS</div></div>';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MODS=[['dash','Início'],['agenda','Agenda'],['pac','Pacientes'],['proc','Procedimentos'],['orc','Orçamentos'],['rec','Recuperação'],['fin','Financeiro'],['cx','Fluxo de caixa'],['pag','Contas a pagar'],['rel','Relatórios'],['cfg','Configurações'],['usr','Usuários e permissões']];
const AL={v:'Ver',c:'Criar',e:'Editar',d:'Excluir'};
let A={clinic:null,groups:[],users:[]},U=null,utab='u',gsel=null,note='';
try{A=JSON.parse(localStorage.getItem('ortonexa_auth'))||A}catch(e){}
try{const id=sessionStorage.getItem('ortonexa_me');U=A.users.find(u=>u.id===id&&u.ativo)||null}catch(e){}
const save=()=>{try{localStorage.setItem('ortonexa_auth',JSON.stringify(A))}catch(e){}};
const rnd=()=>crypto.randomUUID();
async function hash(pw,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const grp=u=>A.groups.find(g=>g.id===u.g)||{nome:'',p:{}};
const can=(m,a='v')=>!!U&&(grp(U).admin||!!(grp(U).p[m]&&grp(U).p[m][a]));
const admins=()=>A.users.filter(u=>u.ativo&&grp(u).admin);
const firstView=()=>(MODS.find(m=>can(m[0]))||['dash'])[0];
function defGroups(){
 const all={},at={};
 MODS.forEach(([k])=>{all[k]={v:1,c:1,e:1,d:1};const v=['dash','agenda','pac','proc','orc','rec'].includes(k),w=['agenda','pac','orc','rec'].includes(k);at[k]={v:+v,c:+w,e:+w,d:0}});
 return [{id:rnd(),nome:'Administrador',desc:'Acesso total e gestão de usuários',admin:1,sis:1,p:all},{id:rnd(),nome:'Atendente',desc:'Rotina de atendimento: agenda, pacientes e orçamentos',sis:1,p:at}];
}
function authScreen(){
 const S=!A.clinic;
 const f=(id,l,t='text',ac='')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${ac?`autocomplete="${ac}"`:''}>`;
 return `<div class="auth-wrap"><div class="auth-brand"><img src="${LOGO}" alt=""><div class="wm">ORTO<b>NEXA</b></div><div class="tg">GESTÃO INTELIGENTE<br>PARA CLÍNICAS</div><p>Tecnologia que conecta.<br>Gestão que transforma.</p></div>
 <div class="auth-form" id="af"><h1>${S?'Primeiro acesso':'Entrar'}</h1><p style="color:var(--mut)">${S?'Cadastre a empresa e o administrador responsável.':'Use o e-mail e a senha cadastrados pelo administrador.'}</p>
 ${S?f('a1','Empresa')+f('a2','Seu nome','text','name'):''}${f('a3','E-mail','email','username')}${f('a4','Senha'+(S?' (mínimo 8 caracteres)':''),'password',S?'new-password':'current-password')}${S?f('a5','Confirmar senha','password','new-password'):''}
 <div id="err" class="neg" role="alert" style="margin-top:10px;min-height:20px"></div><button class="btn" id="ab">${S?'Criar empresa e entrar':'Entrar'}</button>
 <small>Protótipo: os acessos ficam salvos apenas neste navegador. No sistema real, a senha é validada no servidor.</small></div></div>`;
}
const gv=id=>document.getElementById(id).value.trim();
const er=m=>{document.getElementById('err').textContent=m};
async function doSetup(){
 const emp=gv('a1'),nome=gv('a2'),email=gv('a3').toLowerCase(),pw=document.getElementById('a4').value;
 if(!emp||!nome)return er('Informe a empresa e o seu nome.');
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return er('Informe um e-mail válido.');
 if(pw.length<8)return er('A senha precisa ter ao menos 8 caracteres.');
 if(pw!==document.getElementById('a5').value)return er('As senhas não conferem.');
 A.clinic={id:rnd(),nome:emp};A.groups=defGroups();
 const salt=rnd();A.users=[{id:rnd(),nome,email,salt,h:await hash(pw,salt),g:A.groups[0].id,ativo:1}];
 save();entrar(A.users[0]);
}
async function doLogin(){
 const email=gv('a3').toLowerCase(),pw=document.getElementById('a4').value,u=A.users.find(x=>x.email===email);
 if(u&&u.ate>Date.now())return er('Muitas tentativas. Tente novamente em alguns minutos.');
 if(!u||!u.ativo||await hash(pw,u.salt)!==u.h){
  if(u){u.tent=(u.tent||0)+1;if(u.tent>=5){u.ate=Date.now()+9e5;u.tent=0}save()}
  return er('E-mail ou senha incorretos.');
 }
 u.tent=0;u.ate=0;save();entrar(u);
}
function entrar(u){U=u;try{sessionStorage.setItem('ortonexa_me',u.id)}catch(e){};view=firstView();sel=null;render()}
function sair(){U=null;try{sessionStorage.removeItem('ortonexa_me')}catch(e){};render()}
function render(){
 if(!U){
  document.body.classList.add('auth');nav.innerHTML='';app.innerHTML=authScreen();
  const go=A.clinic?doLogin:doSetup;document.getElementById('ab').onclick=go;
  app.querySelectorAll('#af input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});return;
 }
 document.body.classList.remove('auth');
 const items=NAVS.map(([g,l])=>[g,l.filter(([k])=>can(k))]).filter(([,l])=>l.length);
 nav.innerHTML=BRAND+items.map(([g,l])=>`<div class="grp">${g}</div>`+l.map(([k,t])=>`<button data-v="${k}" ${view===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${t}</button>`).join('')).join('')+`<div class="me"><b>${esc(U.nome)}</b><span>${esc(grp(U).nome)}</span><button class="btn alt" data-out>Sair</button></div>`;
 nav.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;sel=null;render()});
 nav.querySelector('[data-out]').onclick=sair;
 const fn=({dash,agenda,pac:pacs,orc,fin:finan,proc:procs,cx,pag,usr})[view]||(()=>soon(view));
 app.innerHTML=can(view)?fn():`<div class="top"><div><h1>Acesso restrito</h1><p>O seu grupo não tem permissão para este módulo.</p></div></div>`;
 bind();
}
function usr(){
 const n=note;note='';
 const tabs=`<div class="chips" role="group" aria-label="Seção"><button class="chip" data-utab="u" aria-pressed="${utab==='u'}">Usuários</button><button class="chip" data-utab="g" aria-pressed="${utab==='g'}">Grupos e permissões</button></div>`;
 const head=`<div class="top"><div><h1>Usuários e permissões</h1><p>Cada pessoa entra com e-mail e senha e só acessa o que o grupo dela permite.</p></div>${tabs}</div>${n?`<div class="card note" role="status">${n}</div>`:''}`;
 if(utab==='u')return head+`${can('usr','c')?'<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn" data-unew>Novo usuário</button></div>':''}
 <div class="card scroll"><table><tr><th>Nome</th><th>E-mail</th><th>Grupo</th><th>Status</th><th></th></tr>
 ${A.users.map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${can('usr','e')?`<select data-ug="${u.id}" aria-label="Grupo de ${esc(u.nome)}" style="width:auto">${A.groups.map(g=>`<option value="${g.id}" ${g.id===u.g?'selected':''}>${esc(g.nome)}</option>`).join('')}</select>`:esc(grp(u).nome)}</td>
 <td>${u.ativo?'<span class="tag s-conf">Ativo</span>':'<span class="tag s-conc">Inativo</span>'}</td>
 <td>${can('usr','e')?`<button class="btn alt" data-ur="${u.id}">Redefinir senha</button> <button class="btn alt" data-ut="${u.id}">${u.ativo?'Desativar':'Reativar'}</button>`:''}</td></tr>`).join('')}</table></div>`;
 const G=A.groups.find(g=>g.id===gsel)||A.groups[0];gsel=G.id;
 const nu=A.users.filter(u=>u.g===G.id).length,ed=can('usr','e')&&!G.admin;
 return head+`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">${A.groups.map(g=>`<button class="chip" data-gsel="${g.id}" aria-pressed="${g.id===G.id}">${esc(g.nome)}</button>`).join('')}${can('usr','c')?'<button class="btn alt" data-gnew style="margin-left:auto">Novo grupo</button>':''}</div>
 <div class="card"><h3>${esc(G.nome)}</h3><p style="color:var(--mut);margin:4px 0 12px">${esc(G.desc||'')} ${nu} usuário(s) neste grupo.${G.admin?' O administrador sempre tem acesso total.':''}</p>
 <div class="scroll"><table><tr><th>Módulo</th>${Object.values(AL).map(l=>`<th>${l}</th>`).join('')}</tr>
 ${MODS.map(([k,l])=>`<tr><td>${l}</td>${Object.keys(AL).map(a=>`<td><input type="checkbox" data-pm="${k}|${a}" aria-label="${l}: ${AL[a]}" ${G.admin||(G.p[k]&&G.p[k][a])?'checked':''} ${ed?'':'disabled'}></td>`).join('')}</tr>`).join('')}</table></div>
 ${can('usr','d')&&!G.sis&&!nu?`<button class="btn alt" data-gdel="${G.id}" style="margin-top:12px">Excluir grupo</button>`:''}</div>`;
}
function dlgBox(title,body,okLabel,onok){
 dlg.innerHTML=`<h2>${title}</h2>${body}<div id="derr" class="neg" role="alert" style="margin-top:8px;min-height:20px"></div><div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end"><button class="btn alt" id="x">Cancelar</button><button class="btn" id="ok">${okLabel}</button></div>`;
 dlg.showModal();document.getElementById('x').onclick=()=>dlg.close();
 document.getElementById('ok').onclick=async()=>{const m=await onok();if(m)document.getElementById('derr').textContent=m;else{dlg.close();render()}};
}
const fld=(id,l,t='text')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${t==='password'?'autocomplete="new-password"':''}>`;
function novoUser(){
 dlgBox('Novo usuário',fld('d1','Nome')+fld('d2','E-mail','email')+fld('d3','Senha (mínimo 8 caracteres)','password')+`<label for="d4">Grupo</label><select id="d4">${A.groups.map(g=>`<option value="${g.id}">${esc(g.nome)}</option>`).join('')}</select>`,'Criar usuário',async()=>{
  const nome=gv('d1'),email=gv('d2').toLowerCase(),pw=document.getElementById('d3').value;
  if(!nome)return 'Informe o nome.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return 'Informe um e-mail válido.';
  if(A.users.some(u=>u.email===email))return 'Já existe um usuário com este e-mail.';
  if(pw.length<8)return 'A senha precisa ter ao menos 8 caracteres.';
  const salt=rnd();A.users.push({id:rnd(),nome,email,salt,h:await hash(pw,salt),g:document.getElementById('d4').value,ativo:1});save();
 });
}
function resetPw(id){
 const u=A.users.find(x=>x.id===id);
 dlgBox('Redefinir senha',`<p style="color:var(--mut);margin:4px 0">${esc(u.nome)}</p>`+fld('d1','Nova senha (mínimo 8 caracteres)','password'),'Salvar senha',async()=>{
  const pw=document.getElementById('d1').value;if(pw.length<8)return 'A senha precisa ter ao menos 8 caracteres.';
  u.salt=rnd();u.h=await hash(pw,u.salt);u.tent=0;u.ate=0;save();
 });
}
function novoGrupo(){
 dlgBox('Novo grupo',fld('d1','Nome do grupo')+fld('d2','Descrição'),'Criar grupo',()=>{
  const nome=gv('d1');if(!nome)return 'Informe o nome do grupo.';
  if(A.groups.some(g=>g.nome.toLowerCase()===nome.toLowerCase()))return 'Já existe um grupo com este nome.';
  const p={};MODS.forEach(([k])=>p[k]={v:k==='dash'?1:0,c:0,e:0,d:0});
  const g={id:rnd(),nome,desc:gv('d2'),p};A.groups.push(g);gsel=g.id;utab='g';save();
 });
}
function bindUsr(){
 const q=(s,f)=>app.querySelectorAll(s).forEach(f);
 q('[data-utab]',b=>b.onclick=()=>{utab=b.dataset.utab;render()});
 q('[data-unew]',b=>b.onclick=novoUser);
 q('[data-gnew]',b=>b.onclick=novoGrupo);
 q('[data-gsel]',b=>b.onclick=()=>{gsel=b.dataset.gsel;render()});
 q('[data-ur]',b=>b.onclick=()=>resetPw(b.dataset.ur));
 q('[data-ug]',s=>s.onchange=()=>{
  const u=A.users.find(x=>x.id===s.dataset.ug),ng=A.groups.find(g=>g.id===s.value);
  if(u.ativo&&grp(u).admin&&!ng.admin&&admins().length<2){note='Mantenha pelo menos um administrador ativo.';return render()}
  u.g=ng.id;save();if(u===U&&!can('usr'))view=firstView();render();
 });
 q('[data-ut]',b=>b.onclick=()=>{
  const u=A.users.find(x=>x.id===b.dataset.ut);
  if(u===U){note='Você não pode desativar o seu próprio acesso.';return render()}
  if(u.ativo&&grp(u).admin&&admins().length<2){note='Mantenha pelo menos um administrador ativo.';return render()}
  u.ativo=u.ativo?0:1;save();render();
 });
 q('[data-gdel]',b=>b.onclick=()=>{A.groups=A.groups.filter(g=>g.id!==b.dataset.gdel);gsel=null;save();render()});
 q('[data-pm]',c=>c.onchange=()=>{
  const [k,a]=c.dataset.pm.split('|'),G=A.groups.find(g=>g.id===gsel),p=G.p[k]=G.p[k]||{v:0,c:0,e:0,d:0};
  p[a]=+c.checked;if(a==='v'&&!c.checked)p.c=p.e=p.d=0;else if(a!=='v'&&c.checked)p.v=1;
  save();if(!can('usr'))view=firstView();render();
 });
}

function dash(){
 const [a,b]=lim[per];
 const rec=ins.filter(i=>i.st==='pago'&&i.pago>=a&&i.pago<=b).reduce((s,i)=>s+i.v,0);
 const prev=ins.filter(i=>i.st==='pendente'&&i.venc>=0).reduce((s,i)=>s+i.v,0);
 const vcd=ins.filter(venc).reduce((s,i)=>s+i.v,0);
 const contr=qt.filter(q=>q.plan).reduce((s,q)=>s+fin(q),0);
 const abertos=qt.filter(q=>['Enviado','Em negociação'].includes(q.st));
 const conf=ap.filter(x=>['conf','atend','conc'].includes(x.st)).length;
 const rec_=pat.filter(p=>p.ult<-180);
 return `<div class="top"><div><h1>Olá, ${esc(U.nome.split(' ')[0])}!</h1><p>Valores contratados, previstos e recebidos ficam separados.</p></div>
 <div class="chips" role="group" aria-label="Período">${[['hoje','Hoje'],['semana','Semana'],['mes','Mês']].map(([k,l])=>`<button class="chip" data-per="${k}" aria-pressed="${per===k}">${l}</button>`).join('')}</div></div>
 <div class="grid">
 <div class="card kpi main"><span>Recebido no período</span><b>${brl(rec)}</b></div>
 <div class="card kpi"><span>Contratado (planos aprovados)</span><b>${brl(contr)}</b></div>
 <div class="card kpi"><span>Previsto a receber</span><b>${brl(prev)}</b></div>
 <div class="card kpi"><span>Em atraso</span><b class="neg">${brl(vcd)}</b></div>
 <div class="card kpi"><span>Orçamentos em aberto</span><b>${abertos.length}</b></div>
 <div class="card kpi"><span>Confirmados hoje</span><b>${conf} de ${ap.length}</b></div></div>
 <div class="two">
 <div class="card"><h3>Agenda de hoje</h3>${ap.length?'':'<p style="color:var(--mut);margin:0">Nenhum atendimento agendado.</p>'}${ap.map(x=>`<div class="row"><div>${x.h} · ${pat[x.p].nome}<small>${x.proc}</small></div>${tag(x.st)}</div>`).join('')}</div>
 <div class="card"><h3>Para recuperar</h3>${!abertos.some(q=>q.dias>=7)&&!rec_.length&&!ins.some(venc)?'<p style="color:var(--mut);margin:0">Nada para recuperar no momento.</p>':''}
 ${abertos.filter(q=>q.dias>=7).map(q=>`<div class="row"><div>${pat[q.p].nome}<small>Orçamento sem decisão há ${q.dias} dias · ${brl(fin(q))}</small></div></div>`).join('')}
 ${rec_.map(p=>`<div class="row"><div>${p.nome}<small>Sem atendimento há ${-p.ult} dias</small></div></div>`).join('')}
 ${ins.filter(venc).map(i=>`<div class="row"><div>${pat[i.p].nome}<small>Parcela ${i.n} vencida · ${brl(i.v)}</small></div></div>`).join('')}</div></div>`;
}
function agenda(){
 return `<div class="top"><div><h1>Agenda</h1><p>Hoje, ${fd(T0)}. O status aparece em texto e em cor.</p></div></div>
 <div class="legend">${Object.keys(ST).map(tag).join('')}</div>
 <div class="card">${ap.length?'':'<p style="color:var(--mut);margin:0">Nenhum atendimento agendado para hoje.</p>'}${ap.map((x,i)=>`<div class="row"><div><b>${x.h}</b> · ${pat[x.p].nome}<small>${x.proc} · ${x.pr}</small></div>
 <div>${tag(x.st)} ${can('agenda','e')&&NEXT[x.st]?`<button class="btn alt" data-adv="${i}">${NEXTL[x.st]}</button>`:''} ${can('agenda','e')&&['aguard','conf'].includes(x.st)?`<button class="btn alt" data-falta="${i}">Registrar falta</button>`:''}</div></div>`).join('')}</div>`;
}
function pacs(){
 if(sel!==null){
  const p=pat[sel], pid=sel;
  const ev=[...ap.filter(x=>x.p===pid).map(x=>[0,`Consulta hoje: ${x.proc}`,ST[x.st]]),
   ...qt.filter(q=>q.p===pid).map(q=>[-q.dias,`${q.id}: ${q.it.join(', ')}`,`${q.st} · ${brl(fin(q))}`]),
   ...ins.filter(i=>i.p===pid).map(i=>[i.pago??i.venc,`Parcela ${i.n} · ${brl(i.v)}`,i.st==='pago'?'Pago':venc(i)?'Vencida':'Pendente'])].sort((a,b)=>b[0]-a[0]);
  const saldo=ins.filter(i=>i.p===pid&&i.st==='pendente').reduce((s,i)=>s+i.v,0);
  return `<div class="top"><div><h1>${p.nome}</h1><p>${p.id} · ${p.tel} · Origem: ${p.origem}</p></div><button class="btn alt" data-back>Voltar à lista</button></div>
  <div class="grid"><div class="card kpi"><span>Saldo devedor</span><b>${brl(saldo)}</b></div><div class="card kpi"><span>Último atendimento</span><b>${p.ult==null?'Sem atendimento':p.ult>-1?'Hoje':'há '+(-p.ult)+' dias'}</b></div></div>
  <div class="card"><h3 style="margin-bottom:12px">Histórico</h3><div class="tl">${ev.map(e=>`<div>${e[1]}<small>${e[0]===0?'Hoje':fd(day(e[0]))} · ${e[2]}</small></div>`).join('')||'Nenhum registro ainda.'}</div></div>`;
 }
 const l=pat.map((p,i)=>[p,i]).filter(([p])=>p.nome.toLowerCase().includes(busca.toLowerCase()));
 return `<div class="top"><div><h1>Pacientes</h1><p>Abra uma ficha para ver o histórico em ordem cronológica.</p></div><div style="display:flex;gap:8px;align-items:center"><div style="width:240px"><input id="q" placeholder="Buscar por nome" value="${busca}" aria-label="Buscar paciente"></div>${can('pac','c')?'<button class="btn" data-novo="pac">Novo paciente</button>':''}</div></div>
 <div class="card scroll"><table><tr><th>ID</th><th>Nome</th><th>Contato</th><th>Origem</th><th></th></tr>
 ${l.map(([p,i])=>`<tr><td>${p.id}</td><td>${p.nome}</td><td>${p.tel}</td><td>${p.origem}</td><td><button class="btn alt" data-pac="${i}">Abrir ficha</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhum paciente encontrado.</td></tr>'}</table></div>`;
}
function orc(){
 return `<div class="top"><div><h1>Orçamentos</h1><p>Aprovar um orçamento gera o plano financeiro, mas não marca nada como realizado.</p></div></div>
 <div class="card scroll"><table><tr><th>Número</th><th>Paciente</th><th>Procedimentos</th><th>Subtotal</th><th>Desconto</th><th>Valor final</th><th>Status</th><th></th></tr>
 ${qt.length?'':'<tr><td colspan="8">Nenhum orçamento criado.</td></tr>'}${qt.map(q=>`<tr><td>${q.id}</td><td>${pat[q.p].nome}</td><td>${q.it.join(', ')}</td><td>${brl(q.sub)}</td><td>${brl(q.desc)}</td><td><b>${brl(fin(q))}</b></td><td>${q.st}</td>
 <td>${q.plan?'Plano gerado':q.st==='Aprovado'||!can('orc','e')?'':`<button class="btn" data-ap="${q.id}">Aprovar e gerar plano</button>`}</td></tr>`).join('')}</table></div>`;
}
function finan(){
 const tot=ins.filter(i=>i.st==='pendente').reduce((s,i)=>s+i.v,0);
 return `<div class="top"><div><h1>Financeiro</h1><p>Saldo a receber: <b>${brl(tot)}</b>. Baixas ficam registradas com data e forma.</p></div></div>
 <div class="card scroll"><table><tr><th>Título</th><th>Paciente</th><th>Parcela</th><th>Valor</th><th>Vencimento</th><th>Forma</th><th>Status</th><th></th></tr>
 ${ins.length?'':'<tr><td colspan="8">Nenhum título a receber.</td></tr>'}${[...ins].sort((a,b)=>a.venc-b.venc).map(i=>`<tr><td>${i.id}</td><td>${pat[i.p].nome}</td><td>${i.n}</td><td>${brl(i.v)}</td><td>${fd(day(i.venc))}</td><td>${i.forma}</td>
 <td>${i.st==='pago'?'<span class="tag s-conf">Pago</span>':venc(i)?'<span class="tag s-falta">Vencida</span>':'<span class="tag s-aguard">Pendente</span>'}</td>
 <td>${i.st==='pendente'&&can('fin','e')?`<button class="btn alt" data-pay="${i.id}">Dar baixa</button>`:''}</td></tr>`).join('')}</table></div>`;
}
function bind(){
 if(view==='usr')bindUsr();
 if(view==='pag'||view==='cx')bindPag();
 app.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{per=b.dataset.per;render()});
 app.querySelectorAll('[data-novo]').forEach(b=>b.onclick=()=>novo(b.dataset.novo));
 app.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>{const x=ap[b.dataset.adv];x.st=NEXT[x.st];if(x.st==='conc')pat[x.p].ult=0;render()});
 app.querySelectorAll('[data-falta]').forEach(b=>b.onclick=()=>{ap[b.dataset.falta].st='falta';render()});
 app.querySelectorAll('[data-pac]').forEach(b=>b.onclick=()=>{sel=+b.dataset.pac;render()});
 app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{sel=null;render()});
 app.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const i=ins.find(x=>x.id===b.dataset.pay);i.st='pago';i.pago=0;render()});
 app.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>plano(b.dataset.ap));
 const q=document.getElementById('q'); if(q)q.oninput=e=>{busca=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
}
function novo(t){
 const P=t==='pac';
 dlg.innerHTML=`<h2>${P?'Novo paciente':'Novo procedimento'}</h2><label for="f1">Nome</label><input id="f1">`+(P?`<label for="f2">Telefone</label><input id="f2"><label for="f3">Origem</label><select id="f3"><option>Indicação</option><option>Instagram</option><option>Site</option><option>Campanha</option></select>`:`<label for="f2">Valor padrão (R$)</label><input id="f2" type="number" min="0" step="0.01"><label for="f3">Duração (min)</label><input id="f3" type="number" min="5" step="5" value="30">`)+`<div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end"><button class="btn alt" id="x">Cancelar</button><button class="btn" id="ok">Salvar</button></div>`;
 dlg.showModal(); x.onclick=()=>dlg.close();
 ok.onclick=()=>{const n=f1.value.trim(); if(!n)return f1.focus();
  if(P)pat.push({id:'PAC-'+String(pat.length+1).padStart(6,'0'),nome:n,tel:f2.value,origem:f3.value,ult:null});
  else proc.push({n,v:Math.round((+f2.value||0)*100),d:+f3.value||30});
  dlg.close();render();};
}
function plano(id){
 const q=qt.find(x=>x.id===id), tot=fin(q);
 dlg.innerHTML=`<h2>Plano financeiro</h2><p style="color:var(--mut);margin:4px 0">${pat[q.p].nome} · total contratado ${brl(tot)}</p>
 <label for="ent">Entrada (R$)</label><input id="ent" type="number" min="0" step="0.01" value="${(tot*0.3/100).toFixed(2)}">
 <label for="fe">Forma da entrada</label><select id="fe"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option></select>
 <label for="np">Parcelas do saldo</label><select id="np">${Array.from({length:12},(_, i)=>`<option ${i==2?'selected':''}>${i+1}</option>`).join('')}</select>
 <label for="fp">Forma prevista das parcelas</label><select id="fp"><option>Cartão de crédito</option><option>Boleto</option><option>Pix</option></select>
 <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end"><button class="btn alt" id="x">Cancelar</button><button class="btn" id="ok">Confirmar plano</button></div>`;
 dlg.showModal();
 x.onclick=()=>dlg.close();
 ok.onclick=()=>{
  if(q.plan)return dlg.close();
  const ent=Math.min(tot,Math.round(parseFloat(ent_.value||0)*100)),n=+np.value,rest=tot-ent,base=Math.floor(rest/n);
  if(ent>0)ins.push({id:'TIT-'+(300+ins.length),q:q.id,p:q.p,n:0,v:ent,venc:0,forma:fe.value,st:'pago',pago:0});
  if(rest>0)for(let k=1;k<=n;k++)ins.push({id:'TIT-'+(300+ins.length),q:q.id,p:q.p,n:k,v:k===n?rest-base*(n-1):base,venc:30*k,forma:fp.value,st:'pendente'});
  q.st='Aprovado';q.plan=true;dlg.close();view='fin';render();
 };
}
const ent_={get value(){return document.getElementById('ent').value}};
render();
</script>
